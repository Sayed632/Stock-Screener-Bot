name: Run Guru Screener Bot

on:
  schedule:
    - cron: '30 3 * * 1-5'   # 9:00 AM IST (Mon-Fri)
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
          SCREENER_USERNAME: ${{ secrets.SCREENER_USERNAME }}
          SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
        run: python scanner.py

      - name: Commit scan results
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add scan_results.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update scan results"
          git push