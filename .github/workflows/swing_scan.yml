name: Swing Trading Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * 1-5'   # 4:00 PM IST (Mon-Fri)

jobs:
  swing-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Swing Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
        run: python swing_scanner.py

      - name: Commit performance log
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add performance_log.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update performance log from swing scanner"
          git push